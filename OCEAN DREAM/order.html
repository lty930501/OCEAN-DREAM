			<script>
function submitOrder() {
    const form = document.getElementById('bookingForm');
    
    if (form.checkValidity()) {
        // 1. 顯示成功彈窗
        Swal.fire({
            title: '訂單送出成功！',
            text: '感謝您的預訂，管家將於 24 小時內與您聯繫。',
            icon: 'success',
            confirmButtonText: '確定',
            confirmButtonColor: '#023047'
        }).then((result) => {
            if (result.isConfirmed) {
                // 2. 透過 Fetch 送出資料到 Google 表單 (防止跳轉)
                const formData = new FormData(form);
                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors' // 這是關鍵，避免跨域問題
                }).then(() => {
                    // 3. 送出後重置表單
                    form.reset();
                    // 4. 重置總金額顯示
                    document.getElementById('displayTotal').innerText = "0";
                    // 視需要可選：重置後滾動回頁面頂部
                    window.scrollTo(0, 0);
                });
            }
        });
    } else {
        form.reportValidity();
    }
}
</script>
</section>
		<script>
function calculateTotal() {
    const roomSelect = document.getElementById('roomType');
    const checkIn = document.getElementById('checkIn').value;
    const checkOut = document.getElementById('checkOut').value;
    const displayTotal = document.getElementById('displayTotal');
    
    // 取得選中的房型資訊
    const selectedOption = roomSelect.options[roomSelect.selectedIndex];
    const pricePerNight = parseInt(roomSelect.value);
    const roomName = selectedOption.getAttribute('data-name'); // 取得房型名稱

    if (roomSelect.value && checkIn && checkOut) {
        const date1 = new Date(checkIn);
        const date2 = new Date(checkOut);
        const diffTime = Math.abs(date2 - date1);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (date2 > date1) {
            const total = diffDays * pricePerNight;
            displayTotal.innerText = total.toLocaleString();
            
            // 同步更新給隱藏欄位
            document.getElementById('roomNameField').value = roomName;
            document.getElementById('totalAmountField').value = total;
        } else {
            displayTotal.innerText = "0";
        }
    }
}
</script>
		<script>
// 在頁面載入時自動設定 min 日期為今天
document.addEventListener("DOMContentLoaded", function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('checkIn').setAttribute('min', today);
    document.getElementById('checkOut').setAttribute('min', today);
});
</script>
